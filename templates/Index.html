<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js" integrity="sha384-IQsoLXl5PILFhosVNubq5LC7Qb9DXgDA9i+tQ8Zj3iwWAwPtgFTxbJ8NT4GN1R8p" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js" integrity="sha384-cVKIPhGWiC2Al4u+LWgxfKTRIcfu0JTxR+EQDz/bgldoEyl4H0zUF0QKbrJ0EcQF" crossorigin="anonymous"></script>
    <title>Login</title>
</head>
<body class="bg-dark text-light">
<div class="container py-5">
    <div class="row">
        <div class="text-center mb-5">
            <p class="fs-2 fw-bold">Disponibilidade de Salas</p>
        </div>

    </div>
    <div class="row justify-content-center">
        <div class="col-10 col-md-6 col-lg-4 bg-light p-4 rounded-3 text-dark border border-primary">
            <div class="text-center">
                <div class="d-grid gap-2 mb-4">
                    <button onclick="Agendamentos()" class="btn btn-primary btn-lg">Agendamentos</button>
                </div>
                <div class="d-grid gap-2"></div>
                <button onclick="VisualizarHorarios()" class="btn btn-primary btn-lg">Visualizar Horários</button>
            </div>                
            <div class="d-grid gap-2 mt-4">
                <button onclick="window.location.href='/salas/Slides'" class="btn btn-primary btn-sm w-25 mx-auto">Slide</button>
            </div>

            </div>
        </div>
    </div>
    
</div>
</body>
<script>
    function Agendamentos() {
        if (confirm("Você precisa logar com email @ufrrj.br para acessar essa funcionalidade. Deseja continuar?"))
            window.location.href = "/salas/login";
    }

    function VisualizarHorarios() {
        alert("Se você está pelo celular recomendo que use o modo paisagem para melhor visualização.");
        window.location.href = "/salas/Blocos";
    }

    

</script>
</html>
