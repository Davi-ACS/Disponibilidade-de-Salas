<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Modo Quiosque — UFRRJ</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles/main.css"/>
  <meta http-equiv="refresh" content="60">
</head>
<body class="kiosk">
  <div class="kiosk-actions">
    <a class="btn btn-ghost" href="../../index.html">← Voltar</a>
    <button class="btn btn-secondary" onclick="document.getElementById('kioskGrid').requestFullscreen?.()">⛶ Tela cheia</button>
    <span style="display:inline-flex; align-items:center; padding:0 12px; font-family:JetBrains Mono, monospace; font-size:.68rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase; border-left:1px solid var(--line-soft)" id="kioskClock"></span>
  </div>
  <div style="text-align:center; margin:18px 0 14px; border:1.5px solid var(--ink); background:var(--paper); padding:14px 18px; width:min(1200px,96vw)">
    <h1 style="font-size:1.35rem; letter-spacing:-.03em; text-transform:uppercase; font-weight:800; display:flex; align-items:center; justify-content:center; gap:10px"><span style="background:var(--ink); color:var(--paper); padding:2px 6px; font-family:JetBrains Mono, monospace; font-size:.70rem; letter-spacing:.08em">Quiosque</span> Salas UFRRJ</h1>
    <p style="font-family:JetBrains Mono, monospace; font-size:.68rem; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); margin-top:6px">Administrativo · Segunda · <span id="clock"></span> · Atualiza a cada 60s · Pronto para TV / Totem</p>
  </div>
  <div class="kiosk-grid" id="kioskGrid"></div>
<script>
const hours=["08:00-09:00","09:00-10:00","10:00-11:00","11:00-12:00","13:00-14:00","14:00-15:00","15:00-16:00","17:00-18:00"];
const rooms=["101","102","103","203","Lab Info 1","Lab Info 2"];
function hash(s){let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return h}
const grid=document.getElementById('kioskGrid');
rooms.forEach(room=>{
  const card=document.createElement('div'); card.className='kiosk-card';
  card.innerHTML=`<h3>Sala ${room} <span style="font-weight:500; opacity:.7; font-size:.66rem">${room.startsWith('Lab')?'Informática':'Administrativo'}</span></h3><table class="kiosk-table"><thead><tr><th>Horário</th><th>Status</th></tr></thead><tbody>`+
    hours.map(h=>{
      const livre=(hash(room+h)%3!==0);
      return `<tr><td>${h}</td><td><span class="pill ${livre?'livre':'ocupado'}" style="padding:4px 8px; font-size:.66rem; min-width:72px">${livre?'Livre':'Ocupado'}</span></td></tr>`;
    }).join('')+'</tbody></table>';
  grid.appendChild(card);
});
function tick(){ const t=new Date().toLocaleTimeString('pt-BR'); const el=document.getElementById('clock'); const el2=document.getElementById('kioskClock'); if(el) el.textContent=t; if(el2) el2.textContent=t; }
setInterval(tick,1000); tick();
let idx=0; setInterval(()=>{ document.querySelectorAll('.kiosk-card').forEach((c,i)=>{c.style.outline=i===idx?'2px solid var(--ink)':''; c.style.outlineOffset='-2px'}); idx=(idx+1)%rooms.length; }, 3500);
</script>
</body>
</html>
