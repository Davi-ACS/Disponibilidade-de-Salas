<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Modo Quiosque — UFRRJ</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles/main.css"/>
  <meta http-equiv="refresh" content="60">
</head>
<body class="kiosk">
  <div class="kiosk-actions">
    <a class="btn btn-ghost" href="../../index.html">← Voltar</a>
    <button class="btn btn-secondary" onclick="document.getElementById('kioskGrid').requestFullscreen?.()">⛶ Tela cheia</button>
  </div>
  <div style="text-align:center; margin-bottom:14px">
    <h1 style="font-size:1.6rem; letter-spacing:-.02em">Salas UFRRJ — Quiosque</h1>
    <p style="color:var(--muted)">Administrativo • Segunda • <span id="clock"></span> • atualiza a cada 60s</p>
  </div>
  <div class="kiosk-grid" id="kioskGrid"></div>
<script>
const hours=["08:00-09:00","09:00-10:00","10:00-11:00","11:00-12:00","13:00-14:00","14:00-15:00","15:00-16:00","17:00-18:00"];
const rooms=["101","102","103","203","Lab Info 1","Lab Info 2"];
function hash(s){let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return h}
const grid=document.getElementById('kioskGrid');
rooms.forEach(room=>{
  const card=document.createElement('div'); card.className='kiosk-card';
  card.innerHTML=`<h3>Sala ${room}</h3><table class="kiosk-table"><thead><tr><th>Horário</th><th>Status</th></tr></thead><tbody>`+
    hours.map(h=>{
      const livre=(hash(room+h)%3!==0);
      return `<tr><td style="font-family:JetBrains Mono,monospace">${h}</td><td><span class="pill ${livre?'livre':'ocupado'}" style="padding:4px 10px;border-radius:999px;font-weight:700;font-size:.78rem">${livre?'Livre':'Ocupado'}</span></td></tr>`;
    }).join('')+'</tbody></table>';
  grid.appendChild(card);
});
function tick(){ document.getElementById('clock').textContent=new Date().toLocaleTimeString('pt-BR'); }
setInterval(tick,1000); tick();
// carrossel: destaca 1 card por vez
let idx=0; setInterval(()=>{ document.querySelectorAll('.kiosk-card').forEach((c,i)=>{c.style.outline=i===idx?'2px solid var(--accent)':''}); idx=(idx+1)%rooms.length; }, 3500);
</script>
</body>
</html>
