[project]
name = "disponibilidade-de-salas"
version = "2.0.0"
description = "Sistema de Disponibilidade e Agendamento de Salas - UFRRJ | FastAPI + UV"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "UFRRJ - DCC", email = "dcc@ufrrj.br" }]
keywords = ["fastapi", "salas", "ufrrj", "agendamento", "disponibilidade"]
classifiers = [
  "Framework :: FastAPI",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

dependencies = [
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.29.0",
  "sqlalchemy>=2.0.27",
  "sqlmodel>=0.0.16",
  "alembic>=1.13.1",
  "pydantic>=2.6.0",
  "pydantic-settings>=2.1.0",
  "python-multipart>=0.0.9",
  "jinja2>=3.1.3",
  "python-jose[cryptography]>=3.3.0",
  "passlib[bcrypt]>=1.7.4",
  "authlib>=1.3.0",
  "httpx>=0.27.0",
  "beautifulsoup4>=4.12.0",
  "python-dotenv>=1.0.0",
  "itsdangerous>=2.1.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "httpx>=0.27.0",
  "ruff>=0.2.0",
  "mypy>=1.8.0",
  "pre-commit>=3.6.0",
]

[project.urls]
Homepage = "https://github.com/ufrrj/disponibilidade-de-salas"
Repository = "https://github.com/ufrrj/disponibilidade-de-salas"
Issues = "https://github.com/ufrrj/disponibilidade-de-salas/issues"

[project.scripts]
app = "app.main:app"

[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "httpx>=0.27.0",
  "ruff>=0.2.0",
  "mypy>=1.8.0",
  "pre-commit>=3.6.0",
]

[tool.uv]
managed = true

[tool.uv.sources]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4", "UP"]
ignore = []

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --strict-markers"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
